[pytest]
markers =
    browser: drives Chromium through Playwright (tests/frontend); skipped when Chromium is not installed
filterwarnings =
    # Third-party only: xarray's netCDF4 backend sets an array shape, which NumPy 2.5 deprecates. It raised
    # about 230 warnings in the suite on a fresh install and is not raised by this repository's code.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:xarray.backends.netCDF4_
    # Third-party only: a NumPy ABI notice from the netCDF4 wheel when it is older than the installed NumPy.
    ignore:numpy.ndarray size changed:RuntimeWarning
